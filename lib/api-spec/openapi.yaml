openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AccessPath campus accessibility API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: locations
  - name: routing
  - name: ai
  - name: reports
  - name: dashboard
  - name: auth
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /locations:
    get:
      operationId: getLocations
      tags: [locations]
      summary: List campus locations and accessibility features
      responses:
        "200":
          description: Campus locations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Location"
  /locations/{id}:
    get:
      operationId: getLocation
      tags: [locations]
      summary: Get a campus location
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Campus location
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "404":
          description: Location not found
  /routes:
    post:
      operationId: findRoutes
      tags: [routing]
      summary: Find and score campus routes for accessibility preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteRequest"
      responses:
        "200":
          description: Recommended and alternative routes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutePlan"
        "400":
          description: Invalid request or no route
  /ai/interpret-needs:
    post:
      operationId: interpretNeeds
      tags: [ai]
      summary: Convert a natural-language accessibility request into preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NeedsInput"
      responses:
        "200":
          description: Structured accessibility preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeedsResult"
  /reports:
    get:
      operationId: getReports
      tags: [reports]
      summary: List accessibility reports
      responses:
        "200":
          description: Accessibility reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccessibilityReport"
    post:
      operationId: createReport
      tags: [reports]
      summary: Submit a barrier report and classify it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Saved accessibility report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessibilityReport"
        "400":
          description: Invalid report
  /reports/{id}/status:
    patch:
      operationId: updateReportStatus
      tags: [reports]
      summary: Update report workflow status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportStatusUpdate"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessibilityReport"
        "404":
          description: Report not found
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get report counts and recent campus activity
      responses:
        "200":
          description: Campus accessibility overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an AccessPath account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "409":
          description: Email already registered
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in to AccessPath
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid email or password
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    Location:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        accessibilityStatus: { type: string, enum: [accessible, partial, limited] }
        stepFreeEntrance: { type: boolean }
        rampAvailable: { type: boolean }
        elevatorAvailable: { type: boolean }
        accessibleWashroom: { type: boolean }
        notes: { type: string }
      required: [id, name, type, latitude, longitude, accessibilityStatus, stepFreeEntrance, rampAvailable, elevatorAvailable, accessibleWashroom, notes]
    Preferences:
      type: object
      properties:
        avoidStairs: { type: boolean }
        preferStepFree: { type: boolean }
        wheelchairAccess: { type: boolean }
        preferElevators: { type: boolean }
        needAccessibleWashroom: { type: boolean }
        avoidSteepPaths: { type: boolean }
        distancePriority: { type: string, enum: [low, balanced, high] }
      required: [avoidStairs, preferStepFree, wheelchairAccess, preferElevators, needAccessibleWashroom, avoidSteepPaths, distancePriority]
    NeedsInput:
      type: object
      properties:
        description: { type: string, minLength: 3, maxLength: 1000 }
      required: [description]
    NeedsResult:
      type: object
      properties:
        preferences:
          $ref: "#/components/schemas/Preferences"
        understoodAs:
          type: array
          items: { type: string }
        mode: { type: string, enum: [live, demo] }
        message: { type: string }
      required: [preferences, understoodAs, mode, message]
    RouteRequest:
      type: object
      properties:
        startLocationId: { type: string }
        destinationLocationId: { type: string }
        preferences:
          $ref: "#/components/schemas/Preferences"
        description: { type: string, maxLength: 1000 }
      required: [startLocationId, destinationLocationId, preferences]
    RoutePoint:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
      required: [id, name, latitude, longitude]
    RouteOption:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        points:
          type: array
          items:
            $ref: "#/components/schemas/RoutePoint"
        distanceMeters: { type: integer }
        walkingMinutes: { type: integer }
        accessibilityScore: { type: integer, minimum: 0, maximum: 100 }
        hasStairs: { type: boolean }
        stepFree: { type: boolean }
        wheelchairSuitable: { type: boolean }
        rampAvailable: { type: boolean }
        elevatorAvailable: { type: boolean }
        explanation:
          type: array
          items: { type: string }
        navigationInstructions: { type: string }
        instructionMode: { type: string, enum: [live, demo] }
      required: [id, label, points, distanceMeters, walkingMinutes, accessibilityScore, hasStairs, stepFree, wheelchairSuitable, rampAvailable, elevatorAvailable, explanation, navigationInstructions, instructionMode]
    RoutePlan:
      type: object
      properties:
        start:
          $ref: "#/components/schemas/Location"
        destination:
          $ref: "#/components/schemas/Location"
        recommendedRouteId: { type: string }
        routes:
          type: array
          items:
            $ref: "#/components/schemas/RouteOption"
        reason: { type: string }
        preferences:
          $ref: "#/components/schemas/Preferences"
      required: [start, destination, recommendedRouteId, routes, reason, preferences]
    ReportInput:
      type: object
      properties:
        locationId: { type: string }
        barrierType:
          type: string
          enum: [Blocked ramp, Broken elevator, Stairs, Inaccessible entrance, Blocked pathway, Incorrect accessibility information, Accessible washroom unavailable, Other]
        description: { type: string, minLength: 8, maxLength: 2000 }
        urgency: { type: string, enum: [low, medium, high, critical] }
        accessibilityImpact: { type: string, maxLength: 1000 }
      required: [locationId, barrierType, description, urgency]
    ReportStatusUpdate:
      type: object
      properties:
        status: { type: string, enum: [Reported, Under Review, Resolved] }
      required: [status]
    AccessibilityReport:
      type: object
      properties:
        id: { type: string }
        locationId: { type: string }
        locationName: { type: string }
        barrierType: { type: string }
        description: { type: string }
        urgency: { type: string, enum: [low, medium, high, critical] }
        accessibilityImpact: { type: ["string", "null"] }
        category: { type: string }
        severity: { type: string, enum: [Low, Medium, High, Critical] }
        affectedUsers:
          type: array
          items: { type: string }
        summary: { type: string }
        recommendedAction: { type: string }
        aiMode: { type: string, enum: [live, demo] }
        status: { type: string, enum: [Reported, Under Review, Resolved] }
        createdAt: { type: string, format: date-time }
      required: [id, locationId, locationName, barrierType, description, urgency, accessibilityImpact, category, severity, affectedUsers, summary, recommendedAction, aiMode, status, createdAt]
    Dashboard:
      type: object
      properties:
        totalReports: { type: integer }
        reported: { type: integer }
        underReview: { type: integer }
        resolved: { type: integer }
        criticalOpen: { type: integer }
        accessibleLocations: { type: integer }
        recentReports:
          type: array
          items:
            $ref: "#/components/schemas/AccessibilityReport"
      required: [totalReports, reported, underReview, resolved, criticalOpen, accessibleLocations, recentReports]
    RegisterInput:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
      required: [name, email, password]
    LoginInput:
      type: object
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
      required: [email, password]
    AuthUser:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
      required: [id, name, email]
    AuthResult:
      type: object
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/AuthUser"
      required: [token, user]